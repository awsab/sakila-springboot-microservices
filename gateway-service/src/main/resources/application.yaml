spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service-route
              uri: lb://catalog-service
              predicates:
                - Path=/catalog/**
              filters:
                - StripPrefix=1
            - id: customer-service-route
              uri: lb://customer-service
              predicates:
                - Path=/customer/**
              filters:
                - StripPrefix=1
                - PrefixPath=/customer-identity/api
            - id: inventory-service-route
              uri: lb://inventory-service
              predicates:
                - Path=/inventory/**
              filters:
                - StripPrefix=1
            - id: rental-service-route
              uri: lb://rental-service
              predicates:
                - Path=/rental/**
              filters:
                - StripPrefix=1
                - PrefixPath=/rental/api

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
