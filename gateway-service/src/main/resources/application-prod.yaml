spring:
  application:
    name: gateway-service
  autoconfigure:
    exclude:
      - org.springframework.cloud.autoconfigure.LifecycleMvcEndpointAutoConfiguration
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
      server:
        webflux:
          routes:
            - id: catalog-service-route
              uri: lb://catalog-service
              predicates:
                - Path=/catalog/**
              filters:
                - StripPrefix=1
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE
                - name: CircuitBreaker
                  args:
                    name: catalogCircuit
                    fallbackUri: forward:/internal/fallback/catalog-service
            - id: customer-service-route
              uri: lb://customer-service
              predicates:
                - Path=/customer/**
              filters:
                - StripPrefix=1
                - PrefixPath=/customer-identity/api
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE
                - name: CircuitBreaker
                  args:
                    name: customerCircuit
                    fallbackUri: forward:/internal/fallback/customer-service
            - id: inventory-service-route
              uri: lb://inventory-service
              predicates:
                - Path=/inventory/**
              filters:
                - StripPrefix=1
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE
                - name: CircuitBreaker
                  args:
                    name: inventoryCircuit
                    fallbackUri: forward:/internal/fallback/inventory-service
            - id: rental-service-route
              uri: lb://rental-service
              predicates:
                - Path=/rental/**
              filters:
                - StripPrefix=1
                - PrefixPath=/rental/api
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE
                - name: CircuitBreaker
                  args:
                    name: rentalCircuit
                    fallbackUri: forward:/internal/fallback/rental-service

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

gateway:
  context:
    user-id-header: X-User-Id
    tenant-id-header: X-Tenant-Id
    request-id-header: X-Request-Id
    max-value-length: 128

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallDurationThreshold: 3s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      catalogCircuit:
        baseConfig: default
      customerCircuit:
        baseConfig: default
      inventoryCircuit:
        baseConfig: default
      rentalCircuit:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 4s
        cancelRunningFuture: true
    instances:
      catalogCircuit:
        baseConfig: default
      customerCircuit:
        baseConfig: default
      inventoryCircuit:
        baseConfig: default
      rentalCircuit:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# ════════════════════════════════════════════════════════════════════════════════
# SPRINGDOC-OPENAPI CONFIGURATION
# Centralized Swagger/OpenAPI documentation for the API gateway
# The GroupedOpenApi beans in OpenApiConfig automatically organize routes by service.
# ════════════════════════════════════════════════════════════════════════════════
springdoc:
  swagger-ui:
    enabled: true
    display-operation-id: true
    url: /v3/api-docs.yaml
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    deepLinking: true

  redoc:
    enabled: true
    url: /v3/api-docs.yaml

  api-docs:
    path: /v3/api-docs
    groups:
      enabled: true

  show-actuator: true
  enable-spring-security: false


